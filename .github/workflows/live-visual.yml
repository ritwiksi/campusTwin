name: Verify live map overlays
on:
  push:
    branches: [rutgers-twin]
    paths: ['.github/workflows/live-visual.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Browser tests against deployed website
        run: |
          python3 -m pip install --user playwright pillow
          cat > /tmp/visual.py <<'PY'
          import asyncio,base64,io,json,time
          from PIL import Image
          from playwright.async_api import async_playwright
          async def run():
            async with async_playwright() as p:
              browser=await p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader'])
              page=await browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              try:
                response=await page.goto('https://rutgers-twin.onrender.com/?audit='+str(int(time.time())),wait_until='domcontentloaded',timeout=90000)
                print('HTTP',response.status if response else None,flush=True)
                print('SERVER_BUILD_HAS_TAGS',await page.locator('.map-building-tag').count(),flush=True)
                await page.wait_for_timeout(16000)
                print('REALITY_LABELS',await page.locator('.map-building-tag:visible').count(),flush=True)
                print('CAMERA_LOCATION',await page.evaluate('() => window.location.href'),flush=True)
                await screenshot(page,'REALITY')
                await page.get_by_role('button',name='Energy',exact=True).click()
                await page.wait_for_timeout(6500)
                print('ENERGY_LABELS',await page.locator('.map-building-tag:visible').count(),flush=True)
                print('HEAT_SHAPES',await page.locator('.map-footprints polygon:visible').count(),flush=True)
                print('HEAT_COLORS',await page.locator('.map-footprints polygon').evaluate_all('(els) => els.map(e => ({fill:e.getAttribute("fill"),points:e.getAttribute("points")?.slice(0,40),display:e.style.display})).slice(0,12)'),flush=True)
                print('TEXT', (await page.locator('body').inner_text())[-1000:],flush=True)
                print('JS_ERRORS',json.dumps(errors[:10]),flush=True)
                await screenshot(page,'ENERGY')
              finally:
                await browser.close()
          async def screenshot(page,name):
            data=await page.screenshot(type='jpeg',quality=32,full_page=False,animations='disabled')
            im=Image.open(io.BytesIO(data)).convert('RGB')
            im.thumbnail((1000,650))
            out=io.BytesIO();im.save(out,format='JPEG',quality=27,optimize=True)
            b64=base64.b64encode(out.getvalue()).decode()
            print(name+'_SCREENSHOT_START',flush=True)
            for i in range(0,len(b64),180):print(b64[i:i+180],flush=True)
            print(name+'_SCREENSHOT_END',flush=True)
          asyncio.run(run())
          PY
          python3 /tmp/visual.py
