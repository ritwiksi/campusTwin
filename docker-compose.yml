services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    expose: ['8000']
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
    depends_on: [backend]
    restart: unless-stopped
    ports: ['80:80']
